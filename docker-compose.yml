services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meu_restaurante}
      POSTGRES_USER: ${POSTGRES_USER:-restaurante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurante_local}
    expose:
      - "5432"
    volumes:
      - restaurante_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurante} -d ${POSTGRES_DB:-meu_restaurante}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://restaurante:restaurante_local@postgres:5432/meu_restaurante}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-CHANGE-ME-IN-PRODUCTION}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-change-mfa-key-with-at-least-32-characters}
      REQUIRE_ADMIN_MFA: ${REQUIRE_ADMIN_MFA:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      SEED_DEMO: ${SEED_DEMO:-false}
      CACTUS_FOOD_BASE_DOMAIN: ${CACTUS_FOOD_BASE_DOMAIN:-food.cactustecnologia.com.br}
      CACTUS_FOOD_CUSTOM_CNAME: ${CACTUS_FOOD_CUSTOM_CNAME:-custom.food.cactustecnologia.com.br}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  restaurante_pgdata:
